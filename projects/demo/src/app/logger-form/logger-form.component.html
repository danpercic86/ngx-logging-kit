<form (ngSubmit)="handleFormSubmission()" [formGroup]="loggerForm">
    <mat-card class="logger-input">
        <mat-card-content>
            <mat-form-field>
                <input formControlName="logMessage" matInput placeholder="Log Message" required>
            </mat-form-field>

            <mat-form-field>
                <mat-select formControlName="logType" name="logType" placeholder="Log Type" required>
                    @for (logType of logTypes; track logType) {
                        <mat-option [value]="logType.value">
                            {{ logType.viewValue }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>

        </mat-card-content>
        <mat-card-actions align="end">
            <button (click)="logError()" mat-raised-button type="button">Log Error</button>
            <button (click)="logComplex()" mat-raised-button type="button">Log Complex Structure</button>
            <button [disabled]="!loggerForm.valid" color="primary" mat-raised-button type="submit">Log Message</button>
        </mat-card-actions>
    </mat-card>
</form>
